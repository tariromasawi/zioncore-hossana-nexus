[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Throne-Hallmark = "HRH Saint Tariro Masawi, The Anointed Commander"

[[redirects]]
  from = "/api/nexus"
  to = "/.netlify/functions/nexus"
  status = 200

[[redirects]]
  from = "/api/node"
  to = "/.netlify/functions/node"
  status = 200
